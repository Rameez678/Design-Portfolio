<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova | Contact</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome: gives us the social media icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="contact">

  <header>
    <a href="index.html" class="logo">NOVA</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="contact-box">
    <h1>LET ME TELL YOUR DIGITAL STORIES</h1>

    <!-- The form. "required" means the box must be filled in before submitting -->
    <form>
      <label for="firstname">FIRST NAME</label>
      <input type="text" id="firstname" name="firstname" required>

      <label for="lastname">LAST NAME</label>
      <input type="text" id="lastname" name="lastname" required>

      <label for="email">EMAIL</label>
      <input type="email" id="email" name="email" required>

      <div class="align-right">
        <button type="submit" class="button">Submit</button>
      </div>
    </form>

    <!-- Social media icons. target="_blank" opens the link in a new tab -->
    <div class="social">
      <a href="https://www.facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
      <a href="https://www.instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://www.x.com" target="_blank" aria-label="X"><i class="fa-brands fa-square-x-twitter"></i></a>
    </div>
  </main>

</body>
</html>
